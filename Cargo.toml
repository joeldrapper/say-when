[package]
name = "say-when"
version = "0.1.2"
description = "Reads days, ranges of days, times and how things repeat, written in plain English"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/joeldrapper/say-when"
documentation = "https://docs.rs/say-when"
readme = "README.md"
keywords = ["date", "parser", "natural-language", "recurrence", "rrule"]
categories = ["date-and-time", "parser-implementations"]
# The cases go with it, so anything that reaches it another way can run them.
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE"]

[features]
# Lets what's read be written out, and options read in, with serde.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The cases, and the timing of them, read their fixture with serde, so
# they're built when the feature's on. Everything else is built without.
[[test]]
name = "cases"
required-features = ["serde"]

[[example]]
name = "bench"
required-features = ["serde"]

# The WebAssembly module the npm package holds (see js/), which is never
# published as a crate.
[workspace]
members = ["js/wasm"]

# Small before fast, for the WebAssembly module: it answers in a
# microsecond or so either way, and every byte of it is fetched.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
