[package]
name = "say-when-wasm"
version = "0.0.0"
description = "say-when as a WebAssembly module, for the npm package: JSON in, JSON out"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
say-when = { path = "../..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
