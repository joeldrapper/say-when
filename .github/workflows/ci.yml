name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, Clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo doc --no-deps --all-features --locked

  test:
    # With none of its features and then with all of them, so what needs
    # serde says so.
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Rust the crates say they build with, and the newest.
        rust: ["1.90", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked
      - run: cargo test --all-features --locked

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --all-features --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p say-when-wasm --target wasm32-unknown-unknown --locked

  # The npm package, in js/: its WebAssembly module built from this commit,
  # the library's cases run through it, and what would be published.
  js:
    name: npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: aube run check
      - run: aube run lint
      - run: aube run test
      - run: npm pack --dry-run

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
